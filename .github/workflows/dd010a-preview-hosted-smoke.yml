name: DD-010A Vercel Preview Hosted Browser Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  issues: read
  pull-requests: read
  statuses: read

concurrency:
  group: dd010a-preview-hosted-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hosted-preview-table-smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'hcinfitong-create' && github.event.pull_request.number == 35
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEEDOU_PR_NUMBER: ${{ github.event.pull_request.number }}
      DEEDOU_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DEEDOU_HOSTED_SUPABASE_URL: https://nwyhxdcslxxjirsmqnxo.supabase.co
      DEEDOU_HOSTED_SUPABASE_PUBLISHABLE_KEY: sb_publishable_AYxnh5BiiFk7EKMmskFxRg_TKzTGYvy
      DEEDOU_HOSTED_BOOTSTRAP_URL: https://nwyhxdcslxxjirsmqnxo.supabase.co/functions/v1/dd008-hosted-smoke-bootstrap
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run DD-010A Vercel Preview hosted browser acceptance
        run: node scripts/dd010a-preview-hosted-smoke.mjs
