name: Phase 1A Free-tier Logical Backup Restore Drill

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: read

concurrency:
  group: phase1a-free-tier-backup-restore
  cancel-in-progress: false

jobs:
  logical-backup-restore-drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      DEEDOU_BACKUP_SOURCE_REF: nwohsyzpmogqjbmknwbl
      BACKUP_ROOT: ${{ runner.temp }}/deedou-phase1a-backup
      ARTIFACT_DIR: artifacts/phase1a-backup
      RESTORE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm runner tools
        run: |
          node --version
          psql --version
          docker --version
          npx supabase --version
          echo "DEEDOU_SUPABASE_CLI_VERSION=$(npx supabase --version)" >> "$GITHUB_ENV"

      - name: Verify required backup secrets
        env:
          DEEDOU_PRODUCTION_DB_URL: ${{ secrets.DEEDOU_PRODUCTION_DB_URL }}
          DEEDOU_BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.DEEDOU_BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          if [ -z "${DEEDOU_PRODUCTION_DB_URL:-}" ]; then
            echo "::error::DEEDOU_PRODUCTION_DB_URL is required for the Phase 1A backup workflow."
            exit 1
          fi
          if [ -z "${DEEDOU_BACKUP_ENCRYPTION_PASSPHRASE:-}" ]; then
            echo "::error::DEEDOU_BACKUP_ENCRYPTION_PASSPHRASE is required for encrypted backup artifacts."
            exit 1
          fi

      - name: Prepare temporary backup workspace
        run: |
          rm -rf "$BACKUP_ROOT"
          mkdir -p "$BACKUP_ROOT/plain" "$BACKUP_ROOT/decrypted" "$ARTIFACT_DIR"

      - name: Capture non-sensitive source verification counts
        env:
          DEEDOU_PRODUCTION_DB_URL: ${{ secrets.DEEDOU_PRODUCTION_DB_URL }}
        run: |
          psql "$DEEDOU_PRODUCTION_DB_URL" -v ON_ERROR_STOP=1 -tA -c "
            select jsonb_pretty(jsonb_build_object(
              'capturedAt', now(),
              'sourceProjectRef', '${DEEDOU_BACKUP_SOURCE_REF}',
              'counts', jsonb_build_object(
                'locations', (select count(*) from public.locations),
                'physicalTables', (select count(*) from public.physical_tables),
                'products', (select count(*) from public.products),
                'productComponents', (select count(*) from public.product_components),
                'orders', (select count(*) from public.orders),
                'staffProfiles', (select count(*) from public.staff_profiles),
                'workstationDevices', (select count(*) from public.workstation_devices),
                'workstationDeviceSessions', (select count(*) from public.workstation_device_sessions)
              ),
              'auth', jsonb_build_object(
                'counts', jsonb_build_object(
                  'users', (select count(*) from auth.users),
                  'identities', (select count(*) from auth.identities),
                  'mfaFactors', (select count(*) from auth.mfa_factors)
                ),
                'relations', jsonb_build_object(
                  'staffProfilesHaveAuthUsers', not exists (
                    select 1
                    from public.staff_profiles sp
                    left join auth.users au on au.id = sp.auth_user_id
                    where au.id is null
                  ),
                  'identitiesHaveAuthUsers', not exists (
                    select 1
                    from auth.identities ai
                    left join auth.users au on au.id = ai.user_id
                    where au.id is null
                  ),
                  'mfaFactorsHaveAuthUsers', not exists (
                    select 1
                    from auth.mfa_factors mf
                    left join auth.users au on au.id = mf.user_id
                    where au.id is null
                  ),
                  'staffAuthUsersHaveIdentity', not exists (
                    select 1
                    from public.staff_profiles sp
                    where not exists (
                      select 1 from auth.identities ai where ai.user_id = sp.auth_user_id
                    )
                  )
                )
              ),
              'migrationHistory', jsonb_build_object(
                'rows', (
                  select coalesce(
                    jsonb_agg(jsonb_build_object('version', version::text, 'name', name::text) order by version::text, name::text),
                    '[]'::jsonb
                  )
                  from supabase_migrations.schema_migrations
                )
              )
            ));
          " > "$BACKUP_ROOT/plain/verification.json"

      - name: Dump roles, schema and data using Supabase logical export
        env:
          DEEDOU_PRODUCTION_DB_URL: ${{ secrets.DEEDOU_PRODUCTION_DB_URL }}
        run: |
          npx supabase db dump --db-url "$DEEDOU_PRODUCTION_DB_URL" --role-only -f "$BACKUP_ROOT/plain/roles.sql"
          npx supabase db dump --db-url "$DEEDOU_PRODUCTION_DB_URL" -f "$BACKUP_ROOT/plain/schema.sql"
          npx supabase db dump --db-url "$DEEDOU_PRODUCTION_DB_URL" --data-only --use-copy -f "$BACKUP_ROOT/plain/data.sql"
          npx supabase db dump --db-url "$DEEDOU_PRODUCTION_DB_URL" --schema supabase_migrations -f "$BACKUP_ROOT/plain/migration_history_schema.sql"
          npx supabase db dump --db-url "$DEEDOU_PRODUCTION_DB_URL" --schema supabase_migrations --data-only --use-copy -f "$BACKUP_ROOT/plain/migration_history_data.sql"
          npx supabase db dump --db-url "$DEEDOU_PRODUCTION_DB_URL" --schema auth -f "$BACKUP_ROOT/plain/auth_schema.sql"
          npx supabase db dump --db-url "$DEEDOU_PRODUCTION_DB_URL" --schema auth --data-only --use-copy -f "$BACKUP_ROOT/plain/auth_data.sql"

      - name: Record pinned CLI standard dump Auth coverage
        run: |
          node scripts/phase1a-backup-bundle.mjs record-probe \
            --verification "$BACKUP_ROOT/plain/verification.json" \
            --schema "$BACKUP_ROOT/plain/schema.sql" \
            --data "$BACKUP_ROOT/plain/data.sql"

      - name: Encrypt logical backup bundle
        env:
          DEEDOU_BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.DEEDOU_BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          node scripts/phase1a-backup-bundle.mjs pack \
            --input-dir "$BACKUP_ROOT/plain" \
            --output "$ARTIFACT_DIR/deedou-production-logical-backup-${GITHUB_RUN_ID}.ddbak.enc" \
            --source-ref "$DEEDOU_BACKUP_SOURCE_REF" \
            --manifest-output "$ARTIFACT_DIR/backup-summary.json"

      - name: Start disposable local Supabase restore target
        run: npx supabase start

      - name: Decrypt backup into temporary restore workspace
        env:
          DEEDOU_BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.DEEDOU_BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          rm -rf "$BACKUP_ROOT/decrypted"
          mkdir -p "$BACKUP_ROOT/decrypted"
          node scripts/phase1a-backup-bundle.mjs unpack \
            --input "$ARTIFACT_DIR/deedou-production-logical-backup-${GITHUB_RUN_ID}.ddbak.enc" \
            --output-dir "$BACKUP_ROOT/decrypted"

      - name: Restore roles, schema and data into disposable database
        run: |
          RESTORE_STARTED_AT="$(date +%s)"
          cat > "$BACKUP_ROOT/decrypted/restore-reset.sql" <<'SQL'
          drop schema if exists public cascade;
          drop schema if exists auth cascade;
          drop schema if exists supabase_migrations cascade;
          SQL
          psql "$RESTORE_DB_URL" \
            --single-transaction \
            --variable ON_ERROR_STOP=1 \
            --file "$BACKUP_ROOT/decrypted/restore-reset.sql" \
            --file "$BACKUP_ROOT/decrypted/roles.sql" \
            --file "$BACKUP_ROOT/decrypted/schema.sql" \
            --file "$BACKUP_ROOT/decrypted/migration_history_schema.sql" \
            --file "$BACKUP_ROOT/decrypted/auth_schema.sql" \
            --command "SET session_replication_role = replica" \
            --file "$BACKUP_ROOT/decrypted/auth_data.sql" \
            --file "$BACKUP_ROOT/decrypted/data.sql" \
            --file "$BACKUP_ROOT/decrypted/migration_history_data.sql"
          echo "DEEDOU_RESTORE_SECONDS=$(( $(date +%s) - RESTORE_STARTED_AT ))" >> "$GITHUB_ENV"

      - name: Verify restored DeeDou objects and row counts
        run: |
          node scripts/phase1a-restore-verify.mjs \
            --decrypted-dir "$BACKUP_ROOT/decrypted" \
            --summary "$ARTIFACT_DIR/restore-summary.md" \
            --restore-seconds "$DEEDOU_RESTORE_SECONDS"

      - name: Remove plaintext backup workspaces
        if: always()
        run: rm -rf "$BACKUP_ROOT/plain" "$BACKUP_ROOT/decrypted"

      - name: Stop disposable local Supabase restore target
        if: always()
        run: npx supabase stop

      - name: Upload encrypted backup bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1a-encrypted-logical-backup
          path: artifacts/phase1a-backup/*.ddbak.enc
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload non-sensitive backup and restore summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1a-backup-restore-summary
          path: |
            artifacts/phase1a-backup/backup-summary.json
            artifacts/phase1a-backup/restore-summary.md
          if-no-files-found: ignore
          retention-days: 14
