name: DD-012 Admin 401 Diagnostic

on:
  pull_request:
    branches: [main]

concurrency:
  group: dd012-admin-401-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  admin-401-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Confirm PostgreSQL client
        run: psql --version

      - name: Confirm pinned Supabase CLI
        run: npx supabase --version

      - name: Start Supabase local stack
        run: npx supabase start

      - name: Reset database from migrations and seed
        run: npx supabase db reset

      - name: Reproduce Admin 401 with request diagnostics
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node scripts/dd012-admin-401-diagnostic.mjs

      - name: Stop Supabase local stack
        if: always()
        run: npx supabase stop
