name: DD-008 Hosted Browser Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: dd008-hosted-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hosted-browser-smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'hcinfitong-create'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEEDOU_HOSTED_SUPABASE_URL: https://nwyhxdcslxxjirsmqnxo.supabase.co
      DEEDOU_HOSTED_SUPABASE_PUBLISHABLE_KEY: sb_publishable_AYxnh5BiiFk7EKMmskFxRg_TKzTGYvy
      DEEDOU_HOSTED_BOOTSTRAP_URL: https://nwyhxdcslxxjirsmqnxo.supabase.co/functions/v1/dd008-hosted-smoke-bootstrap
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run hosted DD-008 authoritative browser acceptance
        run: node scripts/dd008d-hosted-smoke-launcher.mjs
