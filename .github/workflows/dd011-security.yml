name: DD-011 Security Hardening Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/dd011_security_hardening_contract.sql"
      - "src/shared/auth/**"
      - "src/shared/backend/security-admin*.js"
      - "scripts/dd011-*.mjs"
      - ".github/workflows/dd011-security.yml"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vercel.json"

concurrency:
  group: dd011-security-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  dd011-security-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm pinned Supabase CLI
        run: npx supabase --version

      - name: Start Supabase local stack
        run: npx supabase start

      - name: Reset database from migrations and seed
        run: npx supabase db reset

      - name: Run DD-011 security hardening contract
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/dd011_security_hardening_contract.sql

      - name: Stop Supabase local stack
        if: always()
        run: npx supabase stop
