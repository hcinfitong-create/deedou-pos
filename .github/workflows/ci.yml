name: DeeDou CI

on:
  push:
    branches: [main, "fix/**", "feature/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        run: npm run check

      - name: Unit tests
        run: npm test

  backend-db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Confirm pinned Supabase CLI
        run: npx supabase --version

      - name: Start Supabase local stack
        run: npx supabase start

      - name: Reset database from migrations and seed
        run: npx supabase db reset

      - name: Run DD-008A database contract
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/dd008a_contract.sql

      - name: Run DD-008B auth and RBAC database contract
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/dd008b_auth_rbac_contract.sql

      - name: Stop Supabase local stack
        if: always()
        run: npx supabase stop
