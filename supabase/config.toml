project_id = "deedou-pos-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:8099"
additional_redirect_urls = ["http://127.0.0.1:8099"]
enable_signup = false

[auth.email]
enable_signup = true
enable_confirmations = false

# DD-011 local integration: exercise real TOTP enrollment/challenge/verify so
# privileged admin RPC tests obtain a genuine Supabase AAL2 JWT. This affects
# only the disposable local CLI Auth service, not hosted staging/production.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = false
